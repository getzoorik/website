<svg width="1400" height="720" viewBox="0 0 1400 720" xmlns="http://www.w3.org/2000/svg" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif'>
  <rect width="1400" height="720" fill="#FFFFFF"/>
  <!-- left: dedicated VMs -->
  <text x="80" y="92" font-size="30" font-weight="600" fill="#0F1222">Each app on its own VM</text>
  <text x="80" y="128" font-size="20" fill="#6B7086">Every VM is sized for its own peak, so most of it sits idle</text>
  <g font-size="17" fill="#3A3F55">
    <g transform="translate(80,170)">
      <rect width="96" height="400" rx="12" fill="#F6F7FB" stroke="#C9CEDF" stroke-width="2"/>
      <rect x="10" y="300" width="76" height="90" rx="7" fill="#3B5BF5"/>
      <text x="48" y="436" text-anchor="middle">App A</text>
    </g>
    <g transform="translate(196,170)">
      <rect width="96" height="400" rx="12" fill="#F6F7FB" stroke="#C9CEDF" stroke-width="2"/>
      <rect x="10" y="270" width="76" height="120" rx="7" fill="#3B5BF5"/>
      <text x="48" y="436" text-anchor="middle">App B</text>
    </g>
    <g transform="translate(312,170)">
      <rect width="96" height="400" rx="12" fill="#F6F7FB" stroke="#C9CEDF" stroke-width="2"/>
      <rect x="10" y="320" width="76" height="70" rx="7" fill="#3B5BF5"/>
      <text x="48" y="436" text-anchor="middle">App C</text>
    </g>
    <g transform="translate(428,170)">
      <rect width="96" height="400" rx="12" fill="#F6F7FB" stroke="#C9CEDF" stroke-width="2"/>
      <rect x="10" y="290" width="76" height="100" rx="7" fill="#3B5BF5"/>
      <text x="48" y="436" text-anchor="middle">App D</text>
    </g>
    <g transform="translate(544,170)">
      <rect width="96" height="400" rx="12" fill="#F6F7FB" stroke="#C9CEDF" stroke-width="2"/>
      <rect x="10" y="310" width="76" height="80" rx="7" fill="#3B5BF5"/>
      <text x="48" y="436" text-anchor="middle">App E</text>
    </g>
  </g>
  <text x="80" y="660" font-size="20" fill="#0F1222" font-weight="600">5 machines to pay for</text>

  <!-- arrow -->
  <path d="M700 370 h70 M752 352 l20 18 -20 18" fill="none" stroke="#3B5BF5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- right: shared pool -->
  <text x="830" y="92" font-size="30" font-weight="600" fill="#0F1222">The same apps on a shared pool</text>
  <text x="830" y="128" font-size="20" fill="#6B7086">Capacity is sized for their combined demand, plus headroom</text>
  <g transform="translate(830,170)">
    <rect width="230" height="400" rx="12" fill="#F6F7FB" stroke="#C9CEDF" stroke-width="2"/>
    <rect x="12" y="300" width="206" height="90" rx="7" fill="#3B5BF5"/>
    <rect x="12" y="186" width="206" height="106" rx="7" fill="#5B78F7"/>
    <rect x="12" y="70" width="206" height="108" rx="7" fill="#3B5BF5"/>
    <rect x="12" y="12" width="206" height="50" rx="7" fill="none" stroke="#12A97A" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="115" y="44" text-anchor="middle" font-size="17" fill="#117D60">headroom</text>
    <text x="115" y="350" text-anchor="middle" font-size="17" fill="#fff">A + B</text>
    <text x="115" y="244" text-anchor="middle" font-size="17" fill="#fff">C + D</text>
    <text x="115" y="129" text-anchor="middle" font-size="17" fill="#fff">E</text>
    <text x="115" y="436" text-anchor="middle" font-size="17" fill="#3A3F55">Shared pool</text>
  </g>
  <g transform="translate(1080,170)">
    <rect width="230" height="400" rx="12" fill="#fff" stroke="#C9CEDF" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="115" y="196" text-anchor="middle" font-size="20" fill="#6B7086">capacity you</text>
    <text x="115" y="224" text-anchor="middle" font-size="20" fill="#6B7086">no longer pay for</text>
  </g>
  <text x="830" y="660" font-size="20" fill="#0F1222" font-weight="600">Fewer machines to pay for</text>
  <text x="1320" y="700" font-size="15" fill="#9AA0B8" text-anchor="end">Illustration, not to scale</text>
</svg>
