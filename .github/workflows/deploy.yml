name: Deploy to Cloudflare Workers

# Deploys the marketing site to the Cloudflare Worker "zoorik-marketing", which
# serves zoorik.com and its alias hosts (see the custom_domain routes in
# wrangler.jsonc).
#
# ── Release flow ────────────────────────────────────────────────────────────
#   1. Do all work on feature branches cut from `dev`, and merge into `dev`.
#      Nothing on `dev` deploys — it is the integration branch.
#   2. When `dev` is ready to ship, open a PR `dev` → `main`.
#   3. Merging that PR pushes to `main`, which runs this workflow and puts the
#      site live. A merge to main IS a production release.
#   Manual re-run: Actions → this workflow → "Run workflow" (workflow_dispatch),
#   with "Use workflow from" set to `main`. Dispatching any other ref is a no-op:
#   the job is guarded on `github.ref` so a manual run can never ship `dev` or a
#   feature branch to the production Worker.
#
# ── Required repository secrets (Settings → Secrets and variables → Actions) ─
#   CLOUDFLARE_API_TOKEN   — token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id (hex string from dashboard URL)
#
# ── Optional repository variables (same page, "Variables" tab) ───────────────
#   NEXT_PUBLIC_LOGIN_URL   — Coral's sign-in URL, the live card on /login.
#                             Default: https://dev.zoorik.com/coral/login
#
#   A build-time public value inlined into the client bundle, so it is a
#   variable (not a secret). src/config/site.ts falls back to the same default,
#   so the site builds correctly without it — only set it when Coral's sign-in
#   moves. Amoeba has no console URL yet; its /login card says "coming".
#
# NOTE: this app no longer uses Supabase. The old VITE_SUPABASE_URL /
# VITE_SUPABASE_PUBLISHABLE_KEY repo secrets belong to the deleted Vite app,
# are not referenced here, and can be removed.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent overlapping deploys when commits land in quick succession.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    # 🔴 Production guard. `push` is already restricted to main, but
    # `workflow_dispatch` accepts ANY ref, so without this a manual run against
    # `dev` or a feature branch would build that code and deploy it straight to
    # the live zoorik.com Worker. main is the only ref allowed to deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Builds Next.js and bundles it for Workers with @opennextjs/cloudflare.
      # Produces .open-next/worker.js + .open-next/assets/.
      # NEXT_PUBLIC_* must be present HERE (build time) — they are inlined into
      # the bundle and cannot be injected at runtime.
      - name: Build OpenNext bundle
        # The value is resolved to a non-empty string on purpose. src/config/site.ts
        # treats an empty string as unset too, so this is belt-and-braces rather
        # than the only guard — but the fallback that ships should be chosen here,
        # where it is visible, and not silently in the code.
        env:
          NEXT_PUBLIC_LOGIN_URL: ${{ vars.NEXT_PUBLIC_LOGIN_URL || 'https://dev.zoorik.com/coral/login' }}
        run: npx opennextjs-cloudflare build

      # Copies the prerendered pages into .open-next/assets/cdn-cgi/_next_cache,
      # where open-next.config.ts's static-assets cache reads them. Only
      # `opennextjs-cloudflare deploy` does this on its own; the wrangler deploy
      # below does not, so without this step every page renders on the Worker.
      - name: Populate static-assets cache
        run: npx opennextjs-cloudflare populateCache local

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --keep-vars: do not wipe plain-text vars already configured on the
          # zoorik-marketing Worker in the Cloudflare dashboard.
          command: deploy --keep-vars
